<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E10600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0a0f"/>
  
  <!-- Speed lines -->
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#E10600" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="500" x2="1920" y2="500" stroke="#E10600" stroke-width="2" opacity="0.2"/>
  <line x1="0" y1="700" x2="1920" y2="700" stroke="#E10600" stroke-width="2" opacity="0.3"/>
  
  <!-- Ferrari F1 Car Silhouette -->
  <g transform="translate(960, 540) scale(3)" opacity="0.4">
    <!-- Main Body -->
    <rect x="-100" y="-20" width="200" height="40" fill="url(#carGradient)" rx="5"/>
    
    <!-- Nose -->
    <polygon points="100,-15 140,-10 140,10 100,15" fill="url(#carGradient)"/>
    
    <!-- Cockpit -->
    <rect x="-20" y="-25" width="60" height="50" fill="#1a1a1a" opacity="0.6" rx="5"/>
    
    <!-- Rear Wing -->
    <rect x="-110" y="-50" width="20" height="80" fill="#E10600"/>
    
    <!-- Front Wing -->
    <rect x="120" y="-25" width="15" height="50" fill="#000000"/>
    
    <!-- Wheels -->
    <circle cx="-60" cy="25" r="15" fill="#1a1a1a"/>
    <circle cx="-60" cy="-25" r="15" fill="#1a1a1a"/>
    <circle cx="60" cy="25" r="15" fill="#1a1a1a"/>
    <circle cx="60" cy="-25" r="15" fill="#1a1a1a"/>
    
    <!-- Wheel details -->
    <circle cx="-60" cy="25" r="8" fill="#E10600" opacity="0.5"/>
    <circle cx="-60" cy="-25" r="8" fill="#E10600" opacity="0.5"/>
    <circle cx="60" cy="25" r="8" fill="#E10600" opacity="0.5"/>
    <circle cx="60" cy="-25" r="8" fill="#E10600" opacity="0.5"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="960" cy="540" rx="400" ry="200" fill="#E10600" opacity="0.1" filter="blur(100px)"/>
  
  <!-- FERRARI text -->
  <text x="960" y="900" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#E10600" opacity="0.3">FERRARI F1</text>
</svg>
